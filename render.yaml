services:
  # ----------------------------------------
  # 1. BACKEND SERVICE (Express API)
  # ----------------------------------------
  - type: web
    name: bridgebreak-backend
    env: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://bridgebreak-frontend.onrender.com # Adjust if your frontend name differs
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------
  # 2. FRONTEND SERVICE (Next.js)
  # ----------------------------------------
  - type: web
    name: bridgebreak-frontend
    env: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PROXY_TARGET
        value: https://bridgebreak-backend.onrender.com
